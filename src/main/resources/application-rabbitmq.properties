# ============================================================
# RabbitMQ 模块专用配置（profile: rabbitmq）
#
# 仅在 RabbitMqApplication 中通过 setAdditionalProfiles("rabbitmq") 激活，
# 不影响 jwt / inventory / usermanage 模块的启动。
#
# 作用：启动时执行 db/rabbitmq-data.sql，初始化死信消息样例数据。
# ============================================================

# 每次启动都执行初始化脚本（H2 内存库每次都是新的，不会重复累积）
spring.sql.init.mode=always

# 脚本位置：只包含 user_dead_letter 一张表的数据
spring.sql.init.data-locations=classpath:db/rabbitmq-data.sql

# 关键：让 SQL 初始化在 Hibernate 建表之后执行，否则会报 "Table not found"
spring.jpa.defer-datasource-initialization=true
