server.port=8080
spring.application.name=jwt-auth-demo

# ====== H2 内存数据库 ======
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ====== JPA ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 打印 H2 行锁相关日志，便于观察悲观锁等待
logging.level.org.hibernate.engine.jdbc.spi=info

# ============================================================
# RabbitMQ 异步解耦 Demo 配置（com.demo.rabbitmq 模块使用）
# jwt Demo 已在 JwtApplication 中排除 RabbitAutoConfiguration，故不受影响。
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# ===== 发布确认（Publisher Confirm）=====
# correlated：消息确认回调中能拿到 CorrelationData，关联到具体消息
spring.rabbitmq.publisher-confirm-type=correlated
# 开启消息不可路由时的 ReturnCallback
spring.rabbitmq.publisher-returns=true
# RabbitTemplate 设为 mandatory，配合 returns 回调
spring.rabbitmq.template.mandatory=true

# ===== 消费者 =====
# 手动 ack：消费者自行决定 basicAck / basicNack，保证消息不丢失
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# 每次只预取 1 条，消费完再取下一条，便于观察重试顺序
spring.rabbitmq.listener.simple.prefetch=1
# 消费者线程数
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# ============================================================
# Redis 缓存（com.demo.usermanage 模块使用；本机无 Redis 时自动降级直查库）
# ============================================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms
# GET /users/{id} 缓存 TTL：30 分钟
user.cache.ttl-minutes=30
# 更新用户时延迟双删的延迟毫秒数（生产建议异步/MQ 延迟执行，Demo 同步演示）
user.cache.double-delete-delay-ms=500
